name: Merge

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0,12 * * *"

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6.0.2
      with:
        repository: justin0406/Rules
        path: Tool-repo

    # - name: GeoIP
      # run: |
        # mkdir -p Tool-repo/GeoIP
        # curl -L -o Tool-repo/GeoIP/Country.mmdb "https://github.com/xream/geoip/releases/latest/download/ipinfo.country.mmdb"

    - name: Run Bash Script
      run: |
        #!/bin/bash
        repo_name=$(basename "$GITHUB_REPOSITORY")
        if [[ "$repo_name" == "Rules" ]]; then
            echo "Running in Rules repository"
            mkdir -p Tool-repo/Ruleset
            # 合并 SukkaW Direct 规则
            urls=(
                "https://ruleset.skk.moe/List/non_ip/direct.conf"
            )
            > Tool-repo/Ruleset/Direct.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/Direct.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/Direct.list
            done
            # 合并 SukkaW CN 规则
            urls=(
                "https://ruleset.skk.moe/List/non_ip/domestic.conf"
                "https://ruleset.skk.moe/List/ip/domestic.conf"
            )
            > Tool-repo/Ruleset/CN.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/CN.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/CN.list
            done
            # 合并 SukkaW CDN 规则
            urls=(
                "https://ruleset.skk.moe/List/domainset/cdn.conf"
                "https://ruleset.skk.moe/List/non_ip/cdn.conf"
            )
            > Tool-repo/Ruleset/CDN.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/CDN.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/CDN.list
            done
            # 合并 SukkaW ChinaIP 规则
            urls=(
                "https://ruleset.skk.moe/List/ip/china_ip.conf"
                "https://ruleset.skk.moe/List/ip/china_ip_ipv6.conf"
            )
            > Tool-repo/Ruleset/ChinaIP.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/ChinaIP.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/ChinaIP.list
            done
            # 合并 SukkaW TG 规则
            urls=(
                "https://ruleset.skk.moe/List/non_ip/telegram.conf"
                "https://ruleset.skk.moe/List/ip/telegram.conf"
                "https://ruleset.skk.moe/List/ip/telegram_asn.conf"
            )
            > Tool-repo/Ruleset/TG.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/TG.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/TG.list
            done
            # 合并 GFW 规则
            urls=(
                "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list"
                "https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/gfw.txt"
                "https://ruleset.skk.moe/List/non_ip/global.conf"
            )
            > Tool-repo/Ruleset/GFW.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/GFW.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/GFW.list
            done
            # 合并 Speedtest 规则
            urls=(
                "https://git.repcz.link/kelee.one/Tool/Loon/Lsr/SpeedtestInternational.lsr"
                "https://ruleset.skk.moe/List/domainset/speedtest.conf"
            )
            > Tool-repo/Ruleset/Speedtest.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/Speedtest.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/Speedtest.list
            done
            # 合并 AI 规则
            urls=(
                "https://ruleset.skk.moe/List/non_ip/ai.conf"
                "https://ruleset.skk.moe/List/non_ip/apple_intelligence.conf"
                "https://git.repcz.link/kelee.one/Tool/Loon/Lsr/AI.lsr"
                "https://raw.githubusercontent.com/fmz200/wool_scripts/main/Loon/rule/AI.list"
            )
            > Tool-repo/Ruleset/AI.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/AI.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/AI.list
            done
            # 合并 AppleProxy 规则
            urls=(
                "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/AppleProxy/AppleProxy.list"
                "https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Surge/Apple/no-cn-cdn-domain.list"
            )
            > Tool-repo/Ruleset/AppleProxy.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/AppleProxy.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/AppleProxy.list
            done
            # 合并 AppleCN 规则
            urls=(
                "https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Surge/Apple/update-domain.list"
                "https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Surge/Apple/api-domain.list"
                "https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Surge/Apple/cdn-domain.list"
                "https://raw.githubusercontent.com/Elysian-Realme/FuGfConfig/main/ConfigFile/Surge/Apple/domain.list"
                "https://ruleset.skk.moe/List/non_ip/apple_cn.conf"
                "https://ruleset.skk.moe/List/domainset/apple_cdn.conf"
            )
            > Tool-repo/Ruleset/AppleCN.list
            for url in "${urls[@]}"; do
                echo "Downloading: $url"
                curl -f -L "$url" >> Tool-repo/Ruleset/AppleCN.list || { echo "Download Failed: $url"; exit 1; }
                echo "" >> Tool-repo/Ruleset/AppleCN.list
            done
            # 下载规则
            files=(
                # Apple APNS
                "AppleAPNs.list https://git.repcz.link/kelee.one/Tool/Loon/Lsr/ApplePushNotificationService.lsr"
            )
            for file in "${files[@]}"; do
                set -- $file
                echo "Downloading: $2"
                curl -A "Surge iOS/9527" -H "Accept: */*" -f -L -o "Tool-repo/Ruleset/$1" "$2" || { echo "Download Failed: $2"; exit 1; }
            done
            echo "Files downloaded successfully."
        else
            echo "Unknown repository. Please run this script in either Tool or Tool repository."
            exit 1
        fi

    - name: Source build
      run: |
        for file in Tool-repo/Ruleset/*.list ; do
          if [ -f "$file" ]; then
            # 将以"."开头的行的第一个"."替换为 "DOMAIN-SUFFIX"
            sed -i '/^\./s/^\./DOMAIN-SUFFIX,/' "$file"
            # 将除了以 "#" 开头、"空行" 开头之外的行, 在行首添加 "DOMAIN"
            sed -i -E '/^\s*$/b; /^\s*[#;]/b; /^DOMAIN,|^DOMAIN-SUFFIX,|^DOMAIN-KEYWORD,|^DOMAIN-WILDCARD,|^IP-CIDR,|^IP-CIDR6,|^IP-ASN,|^GEOIP,|^AND,|^OR,|^NOT,|^URL-REGEX,|^USER-AGENT,|^PROCESS-NAME,|^DEST-PORT,/b; s/^([^#])/DOMAIN,\1/' "$file"
            # 删除文件中所有 [以 # 或 ; 开头的注释行] + [空行] + [每行中 // 及其后面的内容]
            sed -i -e '/^\s*[#;]/d' -e '/^$/d' -e 's| //.*||'  "$file"
            # 删除指定域名
            sed -i -e '/DOMAIN,this_ruleset_is_made_by_sukkaw.ruleset.skk.moe/d' "$file"
            sed -i -e '/DOMAIN,th1s_rule5et_1s_m4d3_by_5ukk4w_ruleset.skk.moe/d' "$file"
            sed -i -e '/DOMAIN,this_rule_set_is_made_by_sukkaw.skk.moe/d' "$file"
            sed -i -e '/DOMAIN,7h1s_rul35et_i5_mad3_by_5ukk4w-ruleset.skk.moe/d' "$file"
            sed -i -e 's/,reject$//' "$file"
            # 修正格式
            sed -i 's/, */,/g' "$file"
          else
            echo "$file not found."
          fi
        done

    - name: Source sort
      run: |
        for file in Tool-repo/Ruleset/*.list ; do
          if [ -f "$file" ]; then
            sed -i -E '/^IP-CIDR,/!{/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\/[0-9]+/s/^/IP-CIDR,/}' "$file"
            sed -i -E '/^IP-CIDR6,/!{/^[a-fA-F0-9]+:|([a-fA-F0-9]+:+)+[a-fA-F0-9]+\/[0-9]+/s/^/IP-CIDR6,/}' "$file"
            awk '
            /^DOMAIN,/         { print "0 " $0; next }
            /^DOMAIN-SUFFIX,/  { print "1 " $0; next }
            /^DOMAIN-KEYWORD,/ { print "2 " $0; next }
            /^DOMAIN-WILDCARD,/{ print "3 " $0; next }
            /^IP-CIDR,/        { print "4 " $0; next }
            /^IP-CIDR6,/       { print "5 " $0; next }
            /^IP-ASN,/         { print "6 " $0; next }
            /^PROCESS-NAME,/   { print "7 " $0; next }
            /^URL-REGEX,/      { print "8 " $0; next }
            /^USER-AGENT,/     { print "9 " $0; next }
            /^GEOIP,/          { print "10 " $0; next }
            /^AND,/            { print "11 " $0; next }
            /^OR,/             { print "12 " $0; next }
            /^NOT,/            { print "13 " $0; next }
            /^DEST-PORT,/      { print "14 " $0; next }
                               { print "15 " $0; next }
            ' "$file" | sort -k1,1n -k2,2 | cut -d' ' -f2- > "$file.sorted" && mv "$file.sorted" "$file"
            awk '!seen[tolower($0)]++' "$file" > temp && mv temp "$file"
          else
            echo "$file not found."
          fi
        done

    - name: Copy files
      run: |
        rm -rf Tool-repo/{Egern,Loon,QuantumultX,Shadowrocket,Stash,Surge,sing-box,mihomo}
        mkdir -p Tool-repo/{Surge}
        for file in Tool-repo/Ruleset/*.list; do
          filename=$(basename "$file")
          for dir in Surge; do
            mkdir -p "Tool-repo/$dir"
            cp "$file" "Tool-repo/$dir/$filename"
          done
        done
        echo "Files copied successfully."

    - name: Surge
      run: |
        rm -rf Tool-repo/Ruleset
        for file in Tool-repo/Surge/*.list; do
          if [ -f "$file" ]; then
            file_names=$(basename "$file" .list)
            line_count=$(wc -l < "$file")
            awk -v fname="$file_names" 'NR==1 {print "# 规则名称: " fname} {print}' "$file" > tmpfile && mv tmpfile "$file"
            awk -v count="$line_count" 'NR==2 {print "# 规则统计: " count} {print}' "$file" > tmpfile && mv tmpfile "$file"
            sed -i '2a\\' "$file"
          else
            echo "$file not found."
          fi
        done

    - name: Push Update
      run: |
        cd Tool-repo
          if [[ -n $(git status -s) ]]; then
            git config --local user.email "${{ github.actor }}@users.noreply.github.com "
            git config --local user.name "${{ github.actor }}"
            git add -A
            # 获取修改的文件列表，用逗号分隔
            CHANGED_FILES=$(git diff --cached --name-only | sed 's/^/- /')
            # 只获取日期
            CURRENT_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
            # 提交信息：文件名 + 日期
            git commit -m "Update Files List:
        $CHANGED_FILES
        ---
        Time: $CURRENT_DATE"
            git push origin main
          else
            echo "No changes to commit."
          fi

    - name: Cleanup Workflow
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2
